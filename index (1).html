<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Tower Defense</title><style>body{margin:0;background:#222;color:#fff;font-family:sans-serif;text-align:center}canvas{background:#333;border:2px solid #666;margin:10px auto;display:block}</style></head><body><h2>Mini Tower Defense</h2><p>クリックでタワー設置 (50G)</p><canvas id="game" width="1000" height="600"></canvas><script>const c=document.getElementById('game'),x=c.getContext('2d');let money=100,hp=10,wave=1;const towers=[],enemies=[],bullets=[];const path=[{x:0,y:250},{x:300,y:250},{x:300,y:450},{x:700,y:450},{x:700,y:150},{x:1000,y:150}];class E{constructor(){this.x=0;this.y=250;this.hp=50;this.m=50;this.s=1.2;this.t=1}update(){if(this.t>=path.length){hp--;return false}let p=path[this.t],dx=p.x-this.x,dy=p.y-this.y,d=Math.hypot(dx,dy);if(d<this.s){this.x=p.x;this.y=p.y;this.t++}else{this.x+=dx/d*this.s;this.y+=dy/d*this.s}return true}draw(){x.fillStyle='red';x.beginPath();x.arc(this.x,this.y,15,0,7);x.fill();x.fillStyle='lime';x.fillRect(this.x-15,this.y-25,30*(this.hp/this.m),4)}}class T{constructor(a,b){this.x=a;this.y=b;this.r=140;this.cd=0}update(){if(this.cd>0){this.cd--;return}for(const e of enemies){if(Math.hypot(e.x-this.x,e.y-this.y)<this.r){bullets.push(new B(this.x,this.y,e));this.cd=40;break}}}draw(){x.strokeStyle='gray';x.beginPath();x.arc(this.x,this.y,this.r,0,7);x.stroke();x.fillStyle='dodgerblue';x.beginPath();x.arc(this.x,this.y,20,0,7);x.fill()}}class B{constructor(a,b,t){this.x=a;this.y=b;this.t=t}update(){if(!enemies.includes(this.t))return false;let dx=this.t.x-this.x,dy=this.t.y-this.y,d=Math.hypot(dx,dy);if(d<6){this.t.hp-=20;return false}this.x+=dx/d*6;this.y+=dy/d*6;return true}draw(){x.fillStyle='yellow';x.beginPath();x.arc(this.x,this.y,5,0,7);x.fill()}}let timer=0,spawned=0,count=10;c.onclick=e=>{if(money<50)return;const r=c.getBoundingClientRect();towers.push(new T(e.clientX-r.left,e.clientY-r.top));money-=50};function u(){if(hp<=0)return;timer++;if(spawned<count){if(timer>60){enemies.push(new E());spawned++;timer=0}}else if(!enemies.length){wave++;count+=3;spawned=0}for(let i=enemies.length-1;i>=0;i--)if(!enemies[i].update())enemies.splice(i,1);towers.forEach(t=>t.update());for(let i=bullets.length-1;i>=0;i--)if(!bullets[i].update())bullets.splice(i,1);for(let i=enemies.length-1;i>=0;i--)if(enemies[i].hp<=0){money+=10;enemies.splice(i,1)}}function d(){x.clearRect(0,0,1000,600);x.strokeStyle='#aaa';x.lineWidth=40;x.beginPath();x.moveTo(path[0].x,path[0].y);path.forEach(p=>x.lineTo(p.x,p.y));x.stroke();towers.forEach(t=>t.draw());bullets.forEach(b=>b.draw());enemies.forEach(e=>e.draw());x.fillStyle='white';x.font='24px sans-serif';x.fillText(`Gold:${money} HP:${hp} Wave:${wave}`,10,30);if(hp<=0){x.fillStyle='red';x.font='60px sans-serif';x.fillText('GAME OVER',320,300)}}(function loop(){u();d();requestAnimationFrame(loop)})();</script></body></html>
